pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: "*.{ts,tsx,js,mjs,cjs,astro,json,jsonc,md,css,yaml,yml}"
      run: pnpm exec prettier --check {staged_files}

    - name: eslint
      glob: "*.{ts,tsx,js,mjs,astro}"
      run: pnpm exec eslint --max-warnings 0 {staged_files}

    - name: typecheck
      glob: "*.{ts,tsx,astro}"
      run: pnpm exec astro check
